name: Proof GitHub API quota diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-github-quota:
    if: github.ref == 'refs/heads/codex/test-github-quota-diagnostics'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e6e598a0d8eaf011367e4c7334fd083c3d856fa
          persist-credentials: false
      - name: Read existing token quota and board query cost
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          
          token = os.environ.get("GH_TOKEN")
          if not token:
              raise SystemExit("Configured GitHub token missing")
          allowed_headers = {"date", "x-ratelimit-limit", "x-ratelimit-remaining", "x-ratelimit-used", "x-ratelimit-reset", "x-ratelimit-resource", "retry-after", "x-github-request-id"}
          
          def observe(name, args):
              proc = subprocess.run(["gh", "api", "--include", *args], capture_output=True, text=True, timeout=45)
              output = proc.stdout.replace(token, "[redacted]")
              headers = {}
              for line in output.splitlines():
                  key, sep, value = line.partition(":")
                  if sep and key.lower() in allowed_headers:
                      headers[key.lower()] = value.strip()
              payload = {}
              first = output.find("{")
              if first >= 0:
                  try:
                      payload = json.loads(output[first:])
                  except ValueError:
                      pass
              data = payload.get("data") or {}
              resources = payload.get("resources") or {}
              projects = ((data.get("repository") or {}).get("projectsV2") or {}).get("nodes") or []
              project = projects[0] if projects else {}
              items = (project.get("items") or {}).get("nodes") or []
              issue = (data.get("repository") or {}).get("issue") or {}
              summary = {
                  "probe": name,
                  "exit": proc.returncode,
                  "headers": headers,
                  "rateLimit": data.get("rateLimit"),
                  "core": resources.get("core"),
                  "graphql": resources.get("graphql"),
                  "viewer": data.get("viewer"),
                  "project_id": project.get("id"),
                  "item_count_on_page": len(items) if project.get("items") else None,
                  "target_statuses": [
                      {"issue": (i.get("content") or {}).get("number"),
                       "status": (i.get("fieldValueByName") or {}).get("name")}
                      for i in items if (i.get("content") or {}).get("number") == 5
                  ],
                  "issue_project_count": len((issue.get("projectItems") or {}).get("nodes") or []) if issue else None,
                  "errors": payload.get("errors"),
                  "message": payload.get("message"),
              }
              if proc.returncode:
                  summary["error_last_line"] = proc.stderr.replace(token, "[redacted]").strip().splitlines()[-1:] 
              print(json.dumps(summary), flush=True)
              return data.get("rateLimit") or {}
          
          observe("REST quota for the existing workflow credential", ["rate_limit"])
          quota = observe("Minimal GraphQL quota for the existing workflow credential", ["graphql", "-f", 'query=query Proof573ExistingWorkflowQuota { viewer { login } rateLimit { limit remaining used resetAt cost } }'])
          if not isinstance(quota.get("remaining"), int) or quota["remaining"] < 200:
              print(json.dumps({"probe": "board-query diagnostics", "result": "skipped", "reason": "GraphQL headroom unavailable or below 200; no retries"}))
          else:
              module = ast.parse(Path("src/headless_pr_workflow/dispatcher/gateway.py").read_text())
              queries = {}
              for node in module.body:
                  if isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in {"BOARD_ITEMS_QUERY", "BOARD_QUERY"}:
                              queries[target.id] = ast.literal_eval(node.value)
              assert set(queries) == {"BOARD_ITEMS_QUERY", "BOARD_QUERY"}
              for name in ["BOARD_ITEMS_QUERY", "BOARD_QUERY"]:
                  query = queries[name].rstrip()
                  assert query.startswith("query(") and query.endswith("}")
                  query = query[:-1] + "\n rateLimit { limit remaining used resetAt cost }\n}"
                  args = ["graphql", "-f", "query=" + query, "-f", "owner=LauraMardones", "-f", "repo=hpw-board-status-proof-573"]
                  if name == "BOARD_QUERY":
                      args += ["-F", "number=5"]
                  observe(name + " exact board-read selection plus quota metadata", args)
          PY
