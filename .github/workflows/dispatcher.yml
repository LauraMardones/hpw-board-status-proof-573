name: Proof independent retry marker review
on:
  workflow_dispatch:
    inputs:
      allow_extra_haiku:
        description: "Explicit additional Haiku budget approval is required"
        required: true
        default: false
        type: boolean
      refine_issue:
        description: "Marker PR number (isolated review helper only)"
        required: true
        type: string
concurrency:
  group: proof-independent-review-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  independent-marker-review:
    if: github.ref == 'refs/heads/codex/test-retry-review' && inputs.allow_extra_haiku
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: LauraMardones/hpw-board-status-proof-573
      EXPECTED_HEAD: 68a830cae2e099257c3f319d62e43d638598074f
      REVIEW_PR_NUMBER: ${{ inputs.refine_issue }}
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RESERVE_FIVE_HOUR_PERCENT: ${{ vars.RESERVE_FIVE_HOUR_PERCENT }}
      RESERVE_WEEKLY_PERCENT: ${{ vars.RESERVE_WEEKLY_PERCENT }}
      DECISION_BLOCKER_PO_LOGIN: LauraMardones
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 68a830cae2e099257c3f319d62e43d638598074f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing runtime and test tools
        run: pip install -e ".[dev]"
      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Verify exact Ready marker and green CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEW_PR_NUMBER" == "11" ]]
          gh api "repos/$REPO/pulls/$REVIEW_PR_NUMBER" | jq -e --arg want "$EXPECTED_HEAD" --arg repo "$REPO" '.head.sha==$want and .head.repo.full_name==$repo and .state=="open" and .draft==false and .base.ref=="main" and (.body|test("Closes #10([^0-9]|$)";"i"))'
          gh api "repos/$REPO/commits/$EXPECTED_HEAD/check-runs" | jq -e '.check_runs | any(.name=="pytest" and .conclusion=="success" and .status=="completed")'
      - name: Require actual GitHub API headroom
        run: |
          python - <<'PY'
          import json, subprocess
          def gh(*args):
              return json.loads(subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True).stdout)
          core = gh("rate_limit")["resources"]["core"]
          gql = gh("graphql", "-f", "query=query Proof573RetryReview { rateLimit { remaining resetAt cost } }")["data"]["rateLimit"]
          print(json.dumps({"github_api_quota": {"core": core, "graphql": gql}}))
          assert core["remaining"] >= 200 and gql["remaining"] >= 200
          PY
      - name: Ordinary subscription allowance gate - extra Haiku approval required
        run: bash scripts/dispatcher-allowance.sh
      - name: Independent Claude review of the marker only
        shell: bash
        run: |
          set -euo pipefail
          export REVIEW_WORK
          REVIEW_WORK=$(mktemp -d)
          trap 'rm -rf "$REVIEW_WORK"' EXIT
          python - <<'PY'
          import os
          from pathlib import Path
          command = Path(".claude/commands/review.md").read_text().replace("$ARGUMENTS", os.environ["REVIEW_PR_NUMBER"])
          boundary = f"""
          Binding isolated review task:
          Follow the review command only for {os.environ['REPO']} PR #{os.environ['REVIEW_PR_NUMBER']}, exact head {os.environ['EXPECTED_HEAD']}.
          You are the independent Claude reviewer; Codex implemented this marker PR. Read AGENTS.md and the actual linked test story #10, merged spec and current diff/CI.
          The marker owns one harmless document and its ordinary lifecycle gates. Actual latency/session measurements belong to separate collector #6; do not invent an unmet criterion for the marker.
          Only normal review/comment/thread mutations on this verified test PR are authorized. Never merge, push, change source, settings, secrets, reserves or production.
          Use gh api REST for primary PR reads/submission where possible. This token can lack read:org for gh pr view/approval-check; if approval-check cannot run, record the real limitation in the generated review summary as the normal command permits. The coordinator separately verifies acceptance.
          Formal self-approval is unavailable. If no blockers, generate the exact separate-session evidence text with reviewer-provider claude and the normal exact review Session Summary, then submit COMMENT evidence against the verified head. If blockers exist, follow normal classification/thread/REQUEST_CHANGES rules without false approval.
          Never print secrets or environment contents. This helper is an independent review only; it runs no board writer and is not dispatcher/lifecycle proof.
          """
          Path(os.environ["REVIEW_WORK"], "prompt.md").write_text(command + boundary)
          PY
          source scripts/lib/claude-session.sh
          rc=0
          claude_scrubbed_exec "$CLAUDE_CODE_OAUTH_TOKEN" timeout 600 claude -p --model sonnet --max-turns 20 --permission-mode bypassPermissions --strict-mcp-config --output-format stream-json --verbose < "$REVIEW_WORK/prompt.md" > "$REVIEW_WORK/stream.jsonl" 2> "$REVIEW_WORK/stderr.txt" || rc=$?
          jq -cR 'fromjson? // empty | select(type=="object")' "$REVIEW_WORK/stream.jsonl" > "$REVIEW_WORK/events.jsonl"
          jq -r --arg tok "$CLAUDE_CODE_OAUTH_TOKEN" 'select(.type=="result") | (.result // "no result") | split($tok) | join("[redacted]")' "$REVIEW_WORK/events.jsonl"
          jq -se '([.[]|select(.type=="system" and .subtype=="init")]|last|.apiKeySource)=="none" and ([.[]|select(.type=="result")]|last|.subtype=="success" and .is_error==false)' "$REVIEW_WORK/events.jsonl" >/dev/null
          exit "$rc"
