name: Proof retry admission
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    if: github.ref == 'refs/heads/codex/test-retry-admission'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      RESERVE_FIVE_HOUR_PERCENT: ${{ vars.RESERVE_FIVE_HOUR_PERCENT }}
      RESERVE_WEEKLY_PERCENT: ${{ vars.RESERVE_WEEKLY_PERCENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 4e6e598a0d8eaf011367e4c7334fd083c3d856fa
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing runtime
        run: pip install -e .
      - name: Install pinned Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Require actual workflow-token GitHub headroom
        run: |
          python - <<'PY'
          import json, subprocess
          def gh(*args):
              return json.loads(subprocess.run(["gh", "api", *args], check=True, capture_output=True, text=True).stdout)
          rest = gh("rate_limit")["resources"]["core"]
          gql = gh("graphql", "-f", "query=query Proof573RetryAdmission { rateLimit { limit remaining resetAt cost } }")["data"]["rateLimit"]
          print(json.dumps({"github_api_quota": {"core": rest, "graphql": gql}}), flush=True)
          assert rest["remaining"] >= 200 and gql["remaining"] >= 200
          PY
      - name: Ordinary Claude capacity gate - approved Haiku probe 2 of 2
        run: bash scripts/dispatcher-allowance.sh
